    <meta name="theme-color" content="#09090b" />
    <!-- Apply saved / system theme before first paint to avoid a flash -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        var root = document.documentElement;
        root.dataset.theme = t;
        // Reveal animations only when motion is welcome; never leave content hidden.
        if (window.matchMedia('(prefers-reduced-motion: no-preference)').matches) {
          root.classList.add('motion');
          setTimeout(function () { root.classList.add('reveal-fallback'); }, 6000);
        }
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f4ed');
      })();
    </script>
